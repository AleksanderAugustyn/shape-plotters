name: wheels
on:
  push:
    tags: ['[0-9]+.[0-9]+.[0-9]+']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0     # tags for setuptools_scm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build sdist and wheel
        env:
          SETUPTOOLS_SCM_PRETEND_VERSION_FOR_SHAPE_PLOTTERS: ${{ github.ref_name }}
        run: |
          python -m pip install --upgrade build
          python -m build --outdir dist
      - name: Verify wheel in clean venv
        # The tests run from a copy outside the checkout, so they import the
        # installed wheel and not the source tree. The timing budgets are
        # skipped: they are calibrated for a developer machine, not a shared
        # runner.
        env:
          MPLBACKEND: Agg
        run: |
          python -m venv /tmp/verify-wheel
          /tmp/verify-wheel/bin/pip install dist/*.whl pytest
          mkdir /tmp/verify-tests
          cp -r tests conftest.py /tmp/verify-tests/
          cd /tmp/verify-tests
          /tmp/verify-wheel/bin/python -m pytest tests -q --ignore=tests/test_perf.py
          /tmp/verify-wheel/bin/shape-plotters --help
      - name: Verify sdist installs from the tarball
        run: |
          python -m venv /tmp/verify-sdist
          /tmp/verify-sdist/bin/pip install dist/*.tar.gz
          /tmp/verify-sdist/bin/shape-plotters --help
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*
  release:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write        # create/upload the Release
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
  pypi:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/p/shape-plotters
    permissions:
      id-token: write        # PyPI Trusted Publishing (OIDC)
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
