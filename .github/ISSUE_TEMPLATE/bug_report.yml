name: Bug report
description: Something crashes, draws wrong, or won't install
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. pip install shape-plotters
        2. shape-plotters fos
        3. Drag the a3 slider to 0.4
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Error output
      description: The full traceback or terminal output, if any.
      render: shell
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: |
        Run this in the same Python environment as shape-plotters and paste the output.
        The matplotlib backend matters: crashes are often in the GUI toolkit, not shape-plotters.

        ```
        python3 - <<'EOF'
        import platform, sys
        from importlib.metadata import version, PackageNotFoundError
        import matplotlib
        print(platform.platform(), "Python", sys.version.split()[0])
        for pkg in ("shape-plotters", "matplotlib", "numpy", "PyGObject", "PyQt5", "PyQt6", "PySide6"):
            try:
                print(pkg, version(pkg))
            except PackageNotFoundError:
                pass
        print("backend", matplotlib.get_backend())
        EOF
        ```
      render: text
    validations:
      required: true
  - type: textarea
    id: install
    attributes:
      label: How shape-plotters was installed
      description: e.g. `pip install --user`, a venv, pipx, conda; and the distro (e.g. Ubuntu 22.04, WSL2).
    validations:
      required: true
